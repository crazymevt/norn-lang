[package]
name = "norn-vm"
description = "Norn tier-0: reader, seed compiler, bytecode interpreter"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
norn-rt = { path = "../norn-rt" }
cranelift-codegen = "0.137.1"
cranelift-frontend = "0.137.1"
cranelift-native = "0.137.1"
libc = "0.2"
mio = { version = "1", features = ["os-poll", "os-ext", "net"] }
notify = "8"
signal-hook = "0.3"
