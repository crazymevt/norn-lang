[package]
name = "skein-vm"
description = "Skein tier-0: reader, seed compiler, bytecode interpreter"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
skein-rt = { path = "../skein-rt" }
cranelift-codegen = "0.137.1"
cranelift-frontend = "0.137.1"
cranelift-native = "0.137.1"
libc = "0.2"
mio = { version = "1", features = ["os-poll", "os-ext", "net"] }
notify = "8"
signal-hook = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
libloading = "0.8"
num-bigint = "0.4"
num-rational = { version = "0.4", default-features = false, features = ["num-bigint-std"] }
num-traits = "0.2"
num-integer = "0.1"
regex = "1"
# (9.12: compression, and digests/HMAC/secure random; ring is rustls's own)
flate2 = "1"
ring = "0.17"
unicode-segmentation = "1"
unicode-width = "0.2"
