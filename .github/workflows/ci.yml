# Every push to main and every pull request: build, the Rust tests (with
# 37 Skein suites at both tiers), every Skein suite, the lang-tests at three
# tiers against their recorded outputs, and skein check. On macOS arm64 and
# Linux arm64 and x86-64.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # (no window opens for skein.ui's tests)
  SKEIN_UI_HEADLESS: "1"

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
          - name: Linux arm64
            os: ubuntu-24.04-arm
          - name: Linux x86-64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: macOS file limits
        if: runner.os == 'macOS'
        # (as a developer's Mac allows: io.rs holds 10,000 connections, both
        # ends, in one process; skein raises its own limit to this cap)
        run: sudo sysctl -w kern.maxfiles=122880 kern.maxfilesperproc=61440

      - name: Linux packages
        if: runner.os == 'Linux'
        # SQLite for skein.sqlite (loaded at run time), zsh for terminal_test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-0 zsh

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --release

      - name: Rust tests
        # (after a failure too: every failure in one run)
        if: ${{ !cancelled() }}
        run: cargo test --locked --release --workspace --no-fail-fast

      - name: Every Skein suite
        # (after a failure too: every failure in one run)
        if: ${{ !cancelled() }}
        run: target/release/skein test tests/skein

      - name: lang-tests
        # (after a failure too: every failure in one run)
        if: ${{ !cancelled() }}
        run: target/release/skein lang-tests/run.skn

      - name: skein check
        # (after a failure too: every failure in one run)
        if: ${{ !cancelled() }}
        run: target/release/skein check

      - name: The book's examples
        # (on macOS, where they've been run: the rename left seven of them
        # wrong with nothing to say so)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: python3 docs/book/check.py --skein target/release/skein
