# Every push to main and every pull request: build, the Rust tests (with
# 37 Skein suites at both tiers), every Skein suite (and again with
# collections forced), the lang-tests at three
# tiers against their recorded outputs, and skein check. On macOS arm64 and
# Linux arm64 and x86-64. One job also checks the Rust's formatting and
# shows clippy's warnings; macOS runs the book's examples.
#
# Windows on ARM is a job of its own, and for now one that can't fail the
# run: it's new (docs/plans/plan-windows.md), `cargo test` has never run
# there, and it builds against an MMTk patched for Windows
# (tools/windows/mmtk.sh), which Cargo.lock doesn't name.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # (no window opens for skein.ui's tests)
  SKEIN_UI_HEADLESS: "1"

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
          - name: Linux arm64
            os: ubuntu-24.04-arm
          - name: Linux x86-64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: macOS file limits
        if: runner.os == 'macOS'
        # (as a developer's Mac allows: io.rs holds 10,000 connections, both
        # ends, in one process; skein raises its own limit to this cap)
        run: sudo sysctl -w kern.maxfiles=122880 kern.maxfilesperproc=61440

      - name: Linux packages
        if: runner.os == 'Linux'
        # SQLite for skein.sqlite (loaded at run time), zsh for terminal_test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-0 zsh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Rust formatting
        # (rustfmt.toml's style; on one job: it's the same everywhere)
        if: ${{ runner.os == 'Linux' && runner.arch == 'X64' }}
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --locked --release

      - name: Clippy
        # (to be read, not to fail the run: its lints change with each Rust
        # release, which would turn main red with no change here)
        if: ${{ !cancelled() && runner.os == 'Linux' && runner.arch == 'X64' }}
        continue-on-error: true
        run: cargo clippy --locked --release --workspace --all-targets

      - name: Rust tests
        # (after a failure too: every failure in one run)
        if: ${{ !cancelled() }}
        run: cargo test --locked --release --workspace --no-fail-fast

      - name: Every Skein suite
        # (after a failure too: every failure in one run)
        if: ${{ !cancelled() }}
        run: target/release/skein test tests/skein

      - name: Every Skein suite, a collection forced every 50th poll
        # (M11: the collector moves objects and has generations; a stale
        # pointer or a store with no write barrier shows here, and seldom
        # in an ordinary run. After a failure too.)
        if: ${{ !cancelled() }}
        run: target/release/skein test tests/skein
        env:
          SKEIN_TIER: "0"
          SKEIN_GC_STRESS: "50"

      - name: lang-tests
        # (after a failure too: every failure in one run)
        if: ${{ !cancelled() }}
        run: target/release/skein lang-tests/run.skn

      - name: skein check
        # (after a failure too: every failure in one run)
        if: ${{ !cancelled() }}
        run: target/release/skein check

      - name: The book's examples
        # (on macOS, where they've been run: the rename left seven of them
        # wrong with nothing to say so)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: python3 docs/book/check.py --skein target/release/skein

  windows:
    name: Windows arm64
    runs-on: windows-11-arm
    timeout-minutes: 90
    # (to be read, not to fail the run, until it has been green a while)
    continue-on-error: true
    defaults:
      run:
        shell: bash
    env:
      # (MMTk with its Windows layer, in place of the one on crates.io)
      MMTK: --config=patch.crates-io.mmtk.path='target/mmtk-windows'
    steps:
      - name: Files as they are in the repository
        # (Git on Windows would give every text file \r\n line ends: the
        # shell script, the patch, and the outputs the lang-tests compare)
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: clang on the PATH
        # (ring builds C with clang on Windows arm64, and ffi_test builds its
        # fixture with it; where LLVM is installed, it isn't on the PATH)
        run: |
          if [ -x "/c/Program Files/LLVM/bin/clang.exe" ]; then
            echo "C:\\Program Files\\LLVM\\bin" >> "$GITHUB_PATH"
            "/c/Program Files/LLVM/bin/clang.exe" --version
          else
            echo "::warning::No LLVM in C:\\Program Files\\LLVM: clang must already be on the PATH"
            clang --version
          fi

      - name: MMTk with its Windows layer
        run: tools/windows/mmtk.sh

      - name: Build
        run: cargo "$MMTK" build --release

      - name: Every Skein suite
        if: ${{ !cancelled() }}
        run: target/release/skein test tests/skein

      - name: Every Skein suite, a collection forced every 50th poll
        if: ${{ !cancelled() }}
        run: target/release/skein test tests/skein
        env:
          SKEIN_TIER: "0"
          SKEIN_GC_STRESS: "50"

      - name: lang-tests
        if: ${{ !cancelled() }}
        run: target/release/skein lang-tests/run.skn

      - name: Rust tests
        # (never run on Windows before this job: images, 10,000 connections,
        # skein --server, skein lsp, skein new, skein package)
        if: ${{ !cancelled() }}
        run: cargo "$MMTK" test --release --workspace --no-fail-fast
