# Every night (and on demand): every Skein suite in the modes too slow for
# each push, which are what catch tier-1 and collector bugs: tier 0 alone,
# everything compiled from its first call, and a collection forced every
# 50th slow-path poll (SKEIN_GC_STRESS); then the collector's own modes
# (M11), and the two other builds: with the heap checked after every
# collection, and with nothing moved. Scheduled runs use main.
name: Nightly

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SKEIN_UI_HEADLESS: "1"

jobs:
  suites:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
          - name: Linux arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: macOS file limits
        if: runner.os == 'macOS'
        # (as a developer's Mac allows: the suites' many sockets; skein raises
        # its own limit to this cap)
        run: sudo sysctl -w kern.maxfiles=122880 kern.maxfilesperproc=61440

      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-0 zsh

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --release

      - name: Tier 0
        if: ${{ !cancelled() }}
        run: target/release/skein test tests/skein
        env:
          SKEIN_TIER: "0"

      - name: Everything compiled from its first call
        if: ${{ !cancelled() }}
        run: target/release/skein test tests/skein
        env:
          SKEIN_TIER: "1"
          SKEIN_JIT_THRESHOLD: "1"
          SKEIN_JIT_SYNC: "1"

      - name: GC stress
        if: ${{ !cancelled() }}
        run: target/release/skein test tests/skein
        env:
          SKEIN_GC_STRESS: "50"

  # M11: the collector moves objects and has generations. The modes that
  # show a stale pointer or a missed write barrier: each is rare in an
  # ordinary run and each is a crash or a wrong answer far from its cause.
  collector:
    name: Collector, ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
          - name: Linux arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      SKEIN: target/release/skein
      SKEIN_CHECKED: target/check/release/skein
      SKEIN_NON_MOVING: target/non-moving/release/skein
    steps:
      - uses: actions/checkout@v5

      - name: macOS file limits
        if: runner.os == 'macOS'
        run: sudo sysctl -w kern.maxfiles=122880 kern.maxfilesperproc=61440

      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-0 zsh

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: collector
          workspaces: |
            . -> target
            . -> target/check
            . -> target/non-moving

      - name: Build
        run: cargo build --locked --release

      - name: Build with the heap check
        run: cargo build --locked --release --features skein-rt/gc-check --target-dir target/check

      - name: Build with nothing moved
        run: cargo build --locked --release -p skein --features non-moving --target-dir target/non-moving

      # Young collections trace only what the write barrier recorded, so a
      # store without one loses an object.
      - name: GC stress, tier 0
        if: ${{ !cancelled() }}
        run: $SKEIN test tests/skein
        env:
          SKEIN_TIER: "0"
          SKEIN_GC_STRESS: "50"

      - name: GC stress, everything compiled from its first call
        if: ${{ !cancelled() }}
        run: $SKEIN test tests/skein
        env:
          SKEIN_TIER: "1"
          SKEIN_JIT_THRESHOLD: "1"
          SKEIN_JIT_SYNC: "1"
          SKEIN_GC_STRESS: "50"

      - name: A small nursery
        if: ${{ !cancelled() }}
        run: $SKEIN test tests/skein
        env:
          SKEIN_GC_NURSERY: 4m

      # Without generations, every collection moving whatever it may: a
      # pointer kept across a safepoint is stale at the next one.
      - name: Everything moved at each collection, tier 0
        if: ${{ !cancelled() }}
        run: $SKEIN test tests/skein
        env:
          SKEIN_TIER: "0"
          SKEIN_GC_PLAN: immix
          SKEIN_GC_MOVE: stress
          SKEIN_GC_STRESS: "50"

      # The heap walked after every collection: a bad reference is reported
      # at the collection that made it, with the object that holds it.
      - name: The heap checked after every collection
        if: ${{ !cancelled() }}
        run: $SKEIN_CHECKED test tests/skein
        env:
          SKEIN_TIER: "0"
          SKEIN_GC_STRESS: "200"

      # The build of before M11 (the `non-moving` feature): kept working.
      - name: Nothing moved
        if: ${{ !cancelled() }}
        run: $SKEIN_NON_MOVING test tests/skein
